title: "¿Qué hace ganar a una pareja de voleibol de playa?"
author: Nicolle Ramírez y Roger Daza
copyright: "2026"
language: es

execute:
  execute_notebooks: cache
  timeout: 1800

only_build_toc_files: true

bibtex_bibfiles:
  - ../compartido/referencias.bib

sphinx:
  local_extensions:
    estilo_bib: _ext
  config:
    language: es
    html_context:
      default_mode: light
    html_theme_options:
      secondary_sidebar_items: []
    html_show_copyright: true
    bibtex_reference_style: label
    bibtex_default_style: es
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js
    myst_heading_anchors: 3
    nb_code_prompt_show: "Mostrar código"
    nb_code_prompt_hide: "Ocultar código"
    suppress_warnings: ["mystnb.unknown_mime_type"]

html:
  use_download_button: true
  home_page_in_navbar: true

repository:
  url: https://github.com/nicoleramirez2106-ui/dataviz-2026
  path_to_book: jb-book
  branch: main